#
# zephyr.toml - Zephyr-based theme by @jxctn0
#
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# A minimal left prompt
format = """$all$directory$python$character"""

# move the rest of the prompt to the right
#right_format = """$status$git_branch${custom.git_status_dirty}$git_status"""
right_format = """$status$cmd_duration$git_branch${custom.git_status_dirty}$git_status"""

palette="tokyo_night"

###############################################
# Pallette definitions
###############################################
# Define custom colors
[palettes.tokyo_night]
black = '#15161e'
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
purple = '#bb9af7'
red = '#f7768e'
white = '#a9b1d6'
yellow = '#e0af68'

[palettes.tokyo_night_256]
black = '16'
blue = '111'
cyan = '117'
green = '149'
purple = '141'
red = '210'
white = '146'
yellow = '179'

[palettes.wombat]
black = '#000000'
blue = '#5da9f6'
cyan = '#82fff7'
green = '#b1e969'
purple = '#e86aff'
red = '#ff615a'
white = '#dedacf'
yellow = '#ebd99c'

[palettes.wombat_256]
black = '0'
blue = '75'
cyan = '123'
green = '149'
purple = '171'
red = '203'
white = '188'
yellow = '223'

[palettes.material_mac]
black = '#000000'
blue = '#5da9f6'
cyan = '#82fff7'
green = '#b1e969'
purple = '#e86aff'
red = '#ff615a'
white = '#dedacf'
yellow = '#ebd99c'

#################################################
# Segments
#################################################

[battery]
disabled = true

[container]
symbol = ""
format = '[$symbol]($style) '
style = 'bold white'

[character]
success_symbol = "[❯](cyan)[❯](purple)"
error_symbol = "[](red)[❯](yellow)"
# vicmd_symbol = "[❮](purple)[❮](cyan)"

[os]
format = '[$symbol]($style) '
style = 'bold white'

[python]
symbol = ""
format = '[(\($virtualenv\) )]($style)'
style = 'yellow'
pyenv_version_name = true

[directory]
style = "blue"
truncation_length = 50
truncation_symbol = ""
fish_style_pwd_dir_length = 10
read_only = ""
read_only_style = "red"

# right prompt uses left space padding
[git_branch]
format = ' [$branch]($style)'
style = 'green'

[git_status]
format = '( [\[$ahead_behind$stashed\]]($style))'
style = "cyan"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"

[custom.git_status_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol = "•"
style = "white"
format="[$symbol]($style)"
shell = ["sh"]

[cmd_duration]
format = ' [$duration]($style)'

[line_break]
disabled = true

[status]
disabled = false
symbol = ' ✘'

[localip]
ssh_only = true
format = '@[$localipv4](bold blue) '
disabled = false
